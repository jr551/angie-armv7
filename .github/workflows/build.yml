name: build-armv7
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      angie_version:
        description: "Angie version. Leave blank to use the latest upstream version."
        required: false
        default: ""
      force_rebuild:
        description: "Rebuild even if the versioned GHCR tag already exists."
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # create GitHub Releases + upload assets
  packages: write

concurrency:
  group: build-armv7
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.version.outputs.image }}
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - name: Resolve Angie version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || false }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REQUESTED_VERSION: ${{ github.event.inputs.angie_version || '' }}
        run: |
          set -euo pipefail

          image="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<<"$REPOSITORY_OWNER")/angie"

          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="$(
              curl -fsSL https://download.angie.software/files/ \
                | grep -oE 'angie-[0-9]+(\.[0-9]+){2}\.tar\.gz' \
                | sed -E 's/^angie-//; s/\.tar\.gz$//' \
                | sort -V \
                | tail -n 1
            )"
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Unable to resolve a valid Angie version." >&2
            exit 1
          fi

          tag="${image}:${version}-armv7"
          should_build=true
          if [[ "$EVENT_NAME" == "schedule" ]] \
            && [[ "$FORCE_REBUILD" != "true" ]] \
            && docker manifest inspect "$tag" >/dev/null 2>&1; then
            should_build=false
            echo "Scheduled run found existing tag $tag; skipping build."
          fi

          {
            echo "image=$image"
            echo "version=$version"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved Angie $version for $image."

  build:
    needs: version
    if: needs.version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm/v7
            archtag: armv7
            archlabel: armv7
          - platform: linux/riscv64
            archtag: riscv64
            archlabel: riscv64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64,riscv64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ${{ needs.version.outputs.image }}:${{ matrix.archtag }}
            ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}-${{ matrix.archtag }}
          build-args: |
            ANGIE_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.archtag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.archtag }}

      - name: Extract release assets from the pushed image
        shell: bash
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCHTAG: ${{ matrix.archtag }}
        run: |
          set -euo pipefail

          # Extract from the image that was just pushed so the release asset is
          # guaranteed to be exactly what the registry serves.
          ref="$IMAGE:$VERSION-$ARCHTAG"
          docker pull --platform "$PLATFORM" "$ref"
          cid="$(docker create --platform "$PLATFORM" "$ref" /bin/true)"
          docker export "$cid" > /tmp/rootfs.tar
          docker rm "$cid" >/dev/null

          mkdir -p dist
          bin="angie-${VERSION}-linux-${ARCHTAG}"
          tar -xOf /tmp/rootfs.tar usr/bin/angie > "dist/$bin"
          chmod +x "dist/$bin"
          (cd dist && sha256sum "$bin" > "$bin.sha256")

          # Guard: the extracted binary must match the target arch.
          got="$(file -b "dist/$bin")"
          echo "extracted: $got"
          case "$ARCHTAG" in
            armv7)   echo "$got" | grep -qi "ARM" ;;
            riscv64) echo "$got" | grep -qi "RISC-V" ;;
          esac || { echo "extracted binary is not $ARCHTAG — refusing to release" >&2; exit 1; }
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.archtag }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify assets
        run: |
          ls -lh dist/
          test "$(find dist -name 'angie-*' -type f ! -name '*.sha256' | wc -l)" -ge 1

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: angie ${{ needs.version.outputs.version }}
          body: |
            Static `angie` ${{ needs.version.outputs.version }} binaries extracted from the published
            GHCR images `ghcr.io/${{ github.repository_owner }}/angie:${{ needs.version.outputs.version }}-<arch>`.

            | Asset | Arch |
            | --- | --- |
            | `angie-${{ needs.version.outputs.version }}-linux-armv7` | linux/arm/v7 (MikroTik container / armv7) |
            | `angie-${{ needs.version.outputs.version }}-linux-riscv64` | linux/riscv64 |

            Each binary has a matching `.sha256` checksum. Container images are preferred for routers:
            `ghcr.io/${{ github.repository_owner }}/angie:<arch>` or `:<version>-<arch>`.
          files: dist/**
          fail_on_unmatched_files: true
          make_latest: true
